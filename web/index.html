<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grid bot</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mut:#6b6b66;--bd:#dcdcd6;--up:#1d9e75;--dn:#d85a30;--mark:#e6f1fb;--markb:#185fa5}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--tx:#ececec;--mut:#9a9a94;--bd:#333;--mark:#0c447c;--markb:#85b7eb}}
*{box-sizing:border-box}body{margin:0;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:18px;font-weight:500;margin:4px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2{font-size:16px;font-weight:500;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.m div{background:var(--bg);border-radius:8px;padding:8px}
.m small{display:block;color:var(--mut);font-size:12px}.m b{font-size:17px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left}
.sell{color:var(--dn)}.buy{color:var(--up)}.pos{color:var(--up)}.neg{color:var(--dn)}.dim{color:var(--mut)}
tr.mark td{background:var(--mark);color:var(--markb);font-weight:500;border-top:2px solid var(--markb);border-bottom:2px solid var(--markb)}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mut)}
.muted{color:var(--mut);font-size:12px}svg{width:100%;height:90px;display:block}
input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}#login{display:flex;gap:8px}
</style>
</head>
<body>
<h1>Grid bot <span class="tag" id="mode">—</span> <span class="tag" id="exchange">—</span> <span class="tag" id="age">—</span></h1>
<div class="card" id="login"><input id="key" type="password" placeholder="Contraseña del panel" autocomplete="current-password"><button id="go">Entrar</button></div>
<div id="app"></div>
<p class="muted" id="foot"></p>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (x, d = 6) => (typeof x === "number" ? Number(x.toPrecision(d)).toLocaleString("es-AR", { maximumFractionDigits: 8 }) : x);
const signed = (x, d = 4) => `<span class="${x > 0 ? "pos" : x < 0 ? "neg" : "dim"}">${x >= 0 ? "+" : ""}${x.toFixed(d)}</span>`;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const STATE = { running: "operando", paused: "pausado", finished: "detenido" };

function chart(trades) {
  const pts = trades.slice().reverse().filter((t) => t.side === "sell");
  if (pts.length < 2) return '<p class="muted">Sin ventas suficientes para graficar.</p>';
  let acc = 0; const ys = pts.map((t) => (acc += t.pnl || 0));
  const lo = Math.min(0, ...ys), hi = Math.max(...ys) || 1, w = 400, h = 90;
  const c = ys.map((y, i) => `${(i / (ys.length - 1) * w).toFixed(1)},${(h - (y - lo) / (hi - lo || 1) * (h - 6) - 3).toFixed(1)}`);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--up)" stroke-width="2" points="${c.join(" ")}"/></svg>
  <p class="muted">Ganancia realizada acumulada: ${acc >= 0 ? "+" : ""}${acc.toFixed(4)} (${ys.length} ventas)</p>`;
}

function render(s) {
  $("#mode").textContent = s.mode; $("#exchange").textContent = s.exchange;
  const age = Math.round((Date.now() / 1000 - s.updated) / 60);
  $("#age").textContent = age < 1 ? "hace <1 min" : `hace ${age} min`;
  $("#age").style.color = age > 5 ? "var(--dn)" : "";
  const tr = s.pairs.reduce((a, p) => a + p.realized, 0), tu = s.pairs.reduce((a, p) => a + p.unrealized, 0);
  let h = `<div class="card"><div class="m"><div><small>Realizado</small><b>${signed(tr)}</b></div><div><small>No realizado</small><b>${signed(tu)}</b></div>
  <div><small>Neto</small><b>${signed(tr + tu)}</b></div><div><small>Saldo</small><b style="font-size:13px">${esc(s.balance)}</b></div></div>${chart(s.trades)}</div>`;
  for (const p of s.pairs) {
    h += `<div class="card"><h2>${esc(p.symbol)} <span class="tag">${STATE[p.state]}</span></h2><div class="m">
    <div><small>Precio</small><b>${fmt(p.price)}</b></div><div><small>Rango</small><b style="font-size:13px">${fmt(p.low)} – ${fmt(p.high)}</b></div>
    <div><small>Ventas arriba / compras abajo</small><b>${p.sells} / ${p.buys}</b></div><div><small>En cartera</small><b>${fmt(p.held, 5)}</b></div>
    <div><small>Realizado (${p.cycles} ciclos)</small><b>${signed(p.realized)}</b></div><div><small>No realizado</small><b>${signed(p.unrealized)}</b></div></div>
    <table><tr><th>Nivel</th><th>Precio</th><th>Orden</th><th>Cantidad</th><th>Latente</th></tr>`;
    let shown = false;
    const mark = `<tr class="mark"><td>precio</td><td>${fmt(p.price)}</td><td colspan="3">◀ estás acá</td></tr>`;
    for (const r of p.ladder) {
      if (!shown && p.price > r.price) { h += mark; shown = true; }
      if (r.side === "sell") h += `<tr><td>${r.level}</td><td>${fmt(r.price)}</td><td class="sell">venta</td><td>${fmt(r.amount, 5)}</td><td>${signed(r.latent)}</td></tr>`;
      else if (r.side === "buy") h += `<tr><td>${r.level}</td><td>${fmt(r.price)}</td><td class="buy">compra</td><td>${fmt(r.amount, 5)}</td><td class="dim">—</td></tr>`;
      else h += `<tr class="dim"><td>${r.level}</td><td>${fmt(r.price)}</td><td>·</td><td></td><td></td></tr>`;
    }
    if (!shown) h += mark;
    h += "</table></div>";
  }
  $("#app").innerHTML = h;
}

let key = ""; try { key = localStorage.getItem("panelKey") || ""; } catch (e) {}
async function load() {
  if (!key) return;
  try {
    const r = await fetch("/api/estado", { headers: { "x-panel-key": key }, cache: "no-store" });
    if (r.status === 401) { $("#login").style.display = "flex"; $("#foot").textContent = "Contraseña incorrecta."; return; }
    if (!r.ok) { $("#foot").textContent = (await r.json()).error || "Error"; return; }
    $("#login").style.display = "none";
    render(await r.json());
    $("#foot").textContent = "Se actualiza cada 30 s. Comandos: por Telegram.";
  } catch (e) { $("#foot").textContent = "Sin conexión: " + e.message; }
}
$("#go").onclick = () => { key = $("#key").value; try { localStorage.setItem("panelKey", key); } catch (e) {} load(); };
$("#key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
if (key) { $("#login").style.display = "none"; load(); }
setInterval(load, 30000);
</script>
</body>
</html>
